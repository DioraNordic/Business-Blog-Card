<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <meta name="description" content="blog about business">

    <link rel="stylesheet" href="style.css">
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>Business Blog Card | devChallenges.io</title>

  </head>
  <body>
    <div class="container">

    <header class="header-info">
      <div class="main-cover">
        <img src="resources/hero-image-1.jpg" alt="cover photo">
        <img src="resources/white-overlay.svg" alt="" class="overlay-cover">
      </div>
    </header>

    <main class="main-content">
      <h1 class="title">Perfect solution for small business</h1>
      <p>Small businesses need to generate leads to grow. You can use tools like Ringy.</p>
    </main>

    <hr class="devider">
    <section class="contacts">
      <div class="writer-avatar">
        <img src="resources/avatar-image-business-card-1.png" alt="avatar of a writer" class="user-avatar">
      </div>
      
      <div class="writer-info">
        <span class="writer-name">Amy Burgess</span>
        <span class="writer-position">Customer Manger, Solution Oy</span>
      </section>
    </div>
    
  
    <div class="author-info">
      Coded by <a href="#">Your Name Here</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>
  </body>
</html>
